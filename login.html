<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | share4hearts</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Firebase SDK (compat, matches your project) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      background: linear-gradient(135deg, #6a5acd, #00d4a1, #8a4fff, #48c6ef);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animated-bg { position: fixed; top:0; left:0; width:100%; height:100%; overflow:hidden; pointer-events:none; z-index:0; }
    .animated-bg span { position:absolute; display:block; width:8px; height:8px; background: rgba(255,255,255,0.8); border-radius:50%; animation:sparkle 5s linear infinite; box-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 25px rgba(100,255,200,0.4); }
    @keyframes sparkle { 0%{transform:scale(0) translateY(0);opacity:0;} 50%{transform:scale(1.1) translateY(-20px);opacity:1;} 100%{transform:scale(0) translateY(-40px);opacity:0;} }

    .login-container { position: relative; z-index: 1; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .login-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,0.2); border-radius:18px; padding:40px; text-align:center; width:350px; box-shadow:0 0 30px rgba(120,200,255,0.25); animation: fadeInUp 1s ease-in-out; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .login-box h1 { margin-bottom:25px; font-size:2rem; font-weight:600; color:#a7f5e3; text-shadow:0 0 10px rgba(0,0,0,0.3); }
    input { width:100%; padding:12px; margin:10px 0; border:none; border-radius:10px; outline:none; background: rgba(255,255,255,0.15); color:#fff; font-size:1rem; transition:0.3s; }
    input:focus { box-shadow:0 0 8px rgba(0,255,200,0.6); }
    input::placeholder { color:#e0e0e0; }
    .main-btn { width:100%; padding:12px; margin-top:15px; border:none; border-radius:10px; background:linear-gradient(45deg, #40e0d0, #6a5acd); color:#fff; font-weight:600; cursor:pointer; transition:0.3s; font-size:1rem; }
    .main-btn:hover { background:linear-gradient(45deg, #5ed2c2, #7b68ee); transform:scale(1.05); }
    .register-link { margin-top:15px; font-size:0.9rem; color:#fff; }
    .register-link a { color:#a7f5e3; text-decoration:none; font-weight:600; transition:0.2s; }
    .register-link a:hover { color:#00ffc3; text-decoration:underline; }
    .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 8px; display:none; }
  </style>
</head>

<body>
  <!-- Sparkle background -->
  <div class="animated-bg"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <!-- Login form -->
  <div class="login-container">
    <div class="login-box">
      <h1>Welcome Back 💚</h1>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="main-btn">Login</button>
        <div class="error" id="error"></div>
      </form>
      <p class="register-link">
        Don’t have an account? <a href="join.html">Register Now</a>
      </p>
    </div>
  </div>

<script>
  // Your existing Firebase config (kept the same)
  const firebaseConfig = {
    apiKey: "AIzaSyB8p97ph9lfvVkoAd4SucxL1aQ0NGHLmjY",
    authDomain: "sharecare-616af.firebaseapp.com",
    projectId: "sharecare-616af",
    storageBucket: "sharecare-616af.firebasestorage.app",
    messagingSenderId: "45027282617",
    appId: "1:45027282617:web:55627278ee0421fc06d568",
    measurementId: "G-ZY25LNSPMD"
  };
  // Initialize Firebase (if not initialized previously)
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore(); // <-- Firestore for role lookup

  const loginForm = document.getElementById("loginForm");


  const errorDiv = document.getElementById("error");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorDiv.style.display = "none";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      errorDiv.style.display = "block";
      errorDiv.textContent = "Please fill in both fields.";
      return;
    }

    try {
      const userCredential = await auth.signInWithEmailAndPassword(email, password);
      const user = userCredential.user;

      if (user.emailVerified) {
        // --- Role-based redirect START ---
        alert("✅ Login successful!");

        const uid = user.uid;

        // Check donors collection
        const donorDoc = await db.collection("donors").doc(uid).get();
        if (donorDoc.exists) {
          window.location.href = "donation.html"; // donor page
          return;
        }

        // Check receivers collection
        // --- FIXED RECEIVER ROLE CHECK ---
const receiverRef = db.collection("receivers").doc(uid);
const receiverDoc = await receiverRef.get();

// Check if receiver main doc exists OR it has submissions
let isReceiver = false;

if (receiverDoc.exists) {
  isReceiver = true;
} else {
  // Check if submissions subcollection has any doc
  const subSnap = await receiverRef.collection("submissions").limit(1).get();
  if (!subSnap.empty) {
    isReceiver = true;
  }
}

if (isReceiver) {
  window.location.href = "ReceiverDonation.html";
  return;
}


        // Check volunteers collection
        const volDoc = await db.collection("volunteers").doc(uid).get();
        if (volDoc.exists) {
          window.location.href = "VolunteerDonation.html"; // volunteer page
          return;
        }

        // If nothing found
        alert("⚠️ No role assigned to this account. Please register or contact admin.");
      } else {
        alert("⚠️ Please verify your email first!");
        await user.sendEmailVerification();
        alert("Verification email sent again. Check your inbox or spam folder.");
      }
    } catch (error) {
      errorDiv.style.display = "block";
      switch(error.code){
        case "auth/user-not-found": errorDiv.textContent = "No user found with this email."; break;
        case "auth/wrong-password": errorDiv.textContent = "Incorrect password."; break;
        case "auth/invalid-email": errorDiv.textContent = "Invalid email address."; break;
        default: errorDiv.textContent = error.message;
      }
    }
  });
</script>
</body>
</html>
